name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hearten
          POSTGRES_PASSWORD: hearten
          POSTGRES_DB: hearten
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hearten -d hearten"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://hearten:hearten@localhost:5432/hearten
      REQUIRE_DB: "1"
      ALLOW_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev,data]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -v -rs
