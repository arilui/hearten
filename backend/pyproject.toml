[project]
name = "hearten"
version = "0.1.0"
description = "Meals that fit your health, your budget, and your table."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# The AWS Lambda adapter (requirements-lambda.txt pins what's deployed).
lambda = [
    "mangum>=0.17",
]
# Only needed to download and import the USDA datasets.
data = [
    "pandas>=2.2",
    "xlrd>=2.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream rename notice from Starlette's test client; not actionable here.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
